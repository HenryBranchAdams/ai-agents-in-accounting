name: Source or correction
description: Propose evidence, accounting context, or a source correction.
title: "[Corpus] "
body:
  - type: textarea
    id: evidence
    attributes:
      label: Source and evidence
      description: Include original publisher URLs, affected record IDs, and the proposed addition or correction.
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Accounting relevance and limits
      description: Explain the use for accounting agent builders, applicability, limitations, and known reuse rights.
    validations:
      required: true
