name: Export source

on:
  pull_request:
  push:
    branches:
      - chore/repository-hardening

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checkout
        run: tar --exclude=.git -czf repository-source.tar.gz .
      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.tar.gz
          if-no-files-found: error
          retention-days: 1
