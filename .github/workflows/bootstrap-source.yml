name: bootstrap-source

on:
  push:
    branches:
      - feat/repository-hardening

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checkout
        run: |
          git archive --format=zip --output=repository-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.zip
          if-no-files-found: error
          retention-days: 1
