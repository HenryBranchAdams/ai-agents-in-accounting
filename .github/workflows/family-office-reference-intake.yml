name: Prepare family-office reference PR
on:
  push:
    branches: [codex/family-office-reference-library]
    paths:
      - 'data/research/family-office-reference-intake/**'
      - 'scripts/*family-office-reference*'
      - 'src/components/family-office-reference.tsx'
      - '.github/workflows/family-office-reference-intake.yml'
permissions:
  contents: read
concurrency:
  group: family-office-reference-intake
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'HenryBranchAdams/ai-agents-in-accounting' && github.ref == 'refs/heads/codex/family-office-reference-library'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-family-office-reference.mjs
      - run: npm run lint
      - name: Commit prepared files only to the authorized PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/family-office-reference-library
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus data/catalog.json data/coverage data/releases data/research/family-office-reference-2026-09-21 src/pages/record.tsx
          git add -u data/research
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate source-first family-office reference edition 2026-09-21.4'
            test "$(git ls-remote origin refs/heads/codex/family-office-reference-library | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:refs/heads/codex/family-office-reference-library
          fi
      - name: Full committed verification
        run: npm run check
