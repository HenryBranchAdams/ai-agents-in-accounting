name: Prepare family-office reference PR
on:
  push:
    branches: [codex/family-office-reference-library]
    paths:
      - 'scripts/*family-office-reference*'
      - 'tests/family-office-reference-*.test.mjs'
      - '.github/workflows/family-office-reference-intake.yml'
permissions:
  contents: read
concurrency:
  group: family-office-reference-intake
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'HenryBranchAdams/ai-agents-in-accounting' && github.ref == 'refs/heads/codex/family-office-reference-library'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/correct-family-office-reference-headers.mjs
      - run: node scripts/prepare-family-office-reference.mjs
      - run: npm run lint
      - name: Commit corrected edition only to the authorized PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/family-office-reference-library
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus data/catalog.json data/coverage data/releases src/pages/record.tsx scripts/integrate-family-office-reference.mjs scripts/prepare-family-office-reference.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Align family-office edition headers while preserving the earlier snapshot'
            test "$(git ls-remote origin refs/heads/codex/family-office-reference-library | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:refs/heads/codex/family-office-reference-library
          fi
      - name: Build and verify native family-office retrieval
        run: |
          npm run build
          node --test tests/family-office-reference-import.test.mjs tests/family-office-reference-reading.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-office-native-preview
          path: |
            dist/server
            dist/internal
            dist/client
          retention-days: 7
