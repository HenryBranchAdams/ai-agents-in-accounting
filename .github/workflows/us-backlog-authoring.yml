name: Temporary US backlog branch authoring
on:
  push:
    branches: [research/us-backlog-2026-09-16]
    paths: ['.github/workflows/us-backlog-authoring.yml', '.github/us-backlog-repair.json']
permissions:
  contents: write
concurrency:
  group: us-backlog-branch-authoring
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HenryBranchAdams/ai-agents-in-accounting' && github.ref == 'refs/heads/research/us-backlog-2026-09-16' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recover, repair, regenerate and hash-check the declared source
        run: python3 .github/us-backlog-deliver.py
      - name: Check the exact resulting source and generated downloads
        shell: bash
        run: |
          git diff --cached --check
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/nonprofit-check.log"
      - name: Commit only verified work to the existing research branch
        shell: bash
        run: |
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate nonprofit source records, worked close and verified retrieval'
          git push origin HEAD:refs/heads/research/us-backlog-2026-09-16
      - name: Preserve exact source and any uncommitted recovery evidence
        if: always()
        shell: bash
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/repository-source.zip"
          git diff --binary --cached > "$RUNNER_TEMP/uncommitted-research.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonprofit-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-source.zip
            ${{ runner.temp }}/uncommitted-research.patch
            ${{ runner.temp }}/nonprofit-check.log
            dist/
          if-no-files-found: error
          retention-days: 14
