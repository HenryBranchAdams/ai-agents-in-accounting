name: Corpus integrity and retrieval
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the exact verification source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/repository-source.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Retain source and generated verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repository-source.zip
            dist/
          if-no-files-found: error
          retention-days: 14
