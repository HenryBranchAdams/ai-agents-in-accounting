name: Corpus integrity and retrieval
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the exact verification source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/repository-source.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint, typecheck, data validation and design-rule probes
        run: npm run lint
      - name: Build application and exports once
        run: npm run build
      - name: Run every test against the primary build
        run: npm run test:only
      - name: Qualify the tested release
        run: npm run qualify
      - name: Retain source and generated verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repository-source.zip
            dist/server/
            dist/.openai/
            dist/client/assets/data/
            dist/client/assets/navigation-*.js
            dist/client/style.css
            dist/storage/manifest.json
            dist/storage/qualification.json
          if-no-files-found: error
          retention-days: 14
